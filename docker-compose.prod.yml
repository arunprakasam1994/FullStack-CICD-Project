version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: taskmanager-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    image: ghcr.io/${GHCR_OWNER}/taskmanager-backend:${IMAGE_TAG:-latest}
    container_name: taskmanager-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskmanager
    depends_on:
      - mongo

  frontend:
    image: ghcr.io/${GHCR_OWNER}/taskmanager-frontend:${IMAGE_TAG:-latest}
    container_name: taskmanager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo-data:
